<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Live Chat</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; }
        #chat-box { border: 1px solid #ccc; height: 400px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #f9f9f9; border-radius: 5px; }
        .message { margin-bottom: 10px; padding: 5px 10px; border-radius: 4px; background: #e2e3e5; }
        .message .username { font-weight: bold; color: #007bff; margin-right: 5px; }
        .form-group { display: flex; gap: 5px; margin-bottom: 5px; }
        #username-input { width: 30%; }
        #message-input { flex-grow: 1; }
        button { padding: 5px 15px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 3px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <h2>Live Public Chat</h2>
    
    <div id="chat-box"></div>

    <form id="chat-form">
        <div class="form-group">
            <input type="text" id="username-input" placeholder="Username" required maxlength="20">
            <input type="text" id="message-input" placeholder="Type a message..." required autocomplete="off">
            <button type="submit">Send</button>
        </div>
    </form>
    <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js";

    const SUPABASE_URL = "https://dftzcennqaxapouuvgil.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmdHpjZW5ucWF4YXBvdXV2Z2lsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMDY2NjYsImV4cCI6MjEwNDU4MjY2Nn0.Fzg9PiCBOgagQb8JUuPRUcFU1pdAtKPdSrwXZJbcWUs";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const chatBox = document.getElementById("chat-box");
    const chatForm = document.getElementById("chat-form");
    const usernameInput = document.getElementById("username-input");
    const messageInput = document.getElementById("message-input");

    // --- PAGINATION STATE ---
    let oldestLoadedMessage = null;   // stores the timestamp of the oldest message currently loaded
    const PAGE_SIZE = 40;

    // --- AUTO-SCROLL STATE ---
    function isAtBottom() {
        return chatBox.scrollTop + chatBox.clientHeight >= chatBox.scrollHeight - 5;
    }

    // Append message to DOM
    function appendMessage(msg, { prepend = false } = {}) {
        const msgElement = document.createElement("div");
        msgElement.classList.add("message");

        const usernameSpan = document.createElement("span");
        usernameSpan.classList.add("username");
        usernameSpan.textContent = msg.username + ":";

        const textSpan = document.createElement("span");
        textSpan.textContent = msg.text;

        msgElement.appendChild(usernameSpan);
        msgElement.appendChild(textSpan);

        if (prepend) {
            chatBox.insertBefore(msgElement, chatBox.firstChild);
        } else {
            chatBox.appendChild(msgElement);
        }
    }

    // Fetch newest 100 messages
    async function fetchInitialMessages() {
        const { data, error } = await supabase
            .from("messages")
            .select("*")
            .order("created_at", { ascending: false })
            .limit(PAGE_SIZE);

        if (error) {
            console.error("Error fetching messages:", error);
            return;
        }

        // Reverse so they display oldest → newest
        data.reverse().forEach(msg => appendMessage(msg));

        oldestLoadedMessage = data[0]?.created_at;

        // Scroll to bottom once on load
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Load older messages when scrolled to top
    async function loadOlderMessages() {
        if (!oldestLoadedMessage) return;

        const { data, error } = await supabase
            .from("messages")
            .select("*")
            .lt("created_at", oldestLoadedMessage)
            .order("created_at", { ascending: false })
            .limit(PAGE_SIZE);

        if (error) {
            console.error("Error loading older messages:", error);
            return;
        }

        if (data.length === 0) return;

        // Reverse so oldest is first
        data.reverse();

        // Preserve scroll position BEFORE DOM changes
        const oldHeight = chatBox.scrollHeight;

        // --- BATCH INSERT USING A DOCUMENT FRAGMENT ---
        const fragment = document.createDocumentFragment();
        for (const msg of data) {
            const msgElement = document.createElement("div");
            msgElement.classList.add("message");

            const usernameSpan = document.createElement("span");
            usernameSpan.classList.add("username");
            usernameSpan.textContent = msg.username + ":";

            const textSpan = document.createElement("span");
            textSpan.textContent = msg.text;

            msgElement.appendChild(usernameSpan);
            msgElement.appendChild(textSpan);

            fragment.appendChild(msgElement);
        }

        // Insert all 100 messages in ONE operation
        chatBox.insertBefore(fragment, chatBox.firstChild);

        // Update oldest timestamp
        oldestLoadedMessage = data[0].created_at;

        // Restore scroll position
        chatBox.scrollTop = chatBox.scrollHeight - oldHeight;
    }


    // Scroll listener for infinite scroll
    chatBox.addEventListener("scroll", () => {
        if (chatBox.scrollTop === 0) {
            loadOlderMessages();
        }
    });

    // Real-time listener
    function subscribeToMessages() {
        supabase
            .channel("public:messages")
            .on(
                "postgres_changes",
                { event: "INSERT", schema: "public", table: "messages" },
                payload => {
                    const shouldScroll = isAtBottom();
                    appendMessage(payload.new);
                    if (shouldScroll) {
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }
                }
            )
            .subscribe();
    }

    // Send message
    chatForm.addEventListener("submit", async e => {
        e.preventDefault();

        const username = usernameInput.value.trim();
        const text = messageInput.value.trim();
        if (!username || !text) return;

        const { error } = await supabase
            .from("messages")
            .insert([{ username, text }]);

        if (error) {
            console.error("Error sending message:", error);
            alert("Failed to send message.");
        } else {
            messageInput.value = "";
        }
    });

    // Init
    fetchInitialMessages();
    subscribeToMessages();
    </script>

</body>
</html>
