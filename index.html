<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Live Chat</title>
    <!-- Include the Supabase JS Library -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; }
        #chat-box { border: 1px solid #ccc; height: 400px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #f9f9f9; border-radius: 5px; }
        .message { margin-bottom: 10px; padding: 5px 10px; border-radius: 4px; background: #e2e3e5; }
        .message .username { font-weight: bold; color: #007bff; margin-right: 5px; }
        .form-group { display: flex; gap: 5px; margin-bottom: 5px; }
        #username-input { width: 30%; }
        #message-input { flex-grow: 1; }
        button { padding: 5px 15px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 3px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <h2>Live Public Chat</h2>
    
    <div id="chat-box"></div>

    <form id="chat-form">
        <div class="form-group">
            <input type="text" id="username-input" placeholder="Username" required maxlength="20">
            <input type="text" id="message-input" placeholder="Type a message..." required autocomplete="off">
            <button type="submit">Send</button>
        </div>
    </form>

    <script>
        // 1. Initialize Supabase Config
        const SUPABASE_URL = "YOUR_SUPABASE_URL"; 
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY"; 
        const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const usernameInput = document.getElementById('username-input');
        const messageInput = document.getElementById('message-input');

        // 2. Helper function to append a message to the DOM
        function appendMessage(msg) {
            const msgElement = document.createElement('div');
            msgElement.classList.add('message');
            
            const usernameSpan = document.createElement('span');
            usernameSpan.classList.add('username');
            usernameSpan.textContent = msg.username + ":";

            const textSpan = document.createElement('span');
            textSpan.textContent = msg.text;

            msgElement.appendChild(usernameSpan);
            msgElement.appendChild(textSpan);
            chatBox.appendChild(msgElement);
            
            // Auto-scroll to the bottom of the chat box
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 3. Fetch past messages on page load
        async function fetchMessages() {
            const { data, error } = await supabase
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true })
                .limit(100);

            if (error) console.error('Error fetching messages:', error);
            else data.forEach(appendMessage);
        }

        // 4. Listen for real-time new messages
        function subscribeToMessages() {
            supabase
                .channel('public:messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    appendMessage(payload.new);
                })
                .subscribe();
        }

        // 5. Send a new message to Supabase on form submit
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = usernameInput.value.trim();
            const text = messageInput.value.trim();

            if (!username || !text) return;

            const { error } = await supabase
                .from('messages')
                .insert([{ username, text }]);

            if (error) {
                console.error('Error sending message:', error);
                alert('Failed to send message.');
            } else {
                messageInput.value = ''; // Clear the input field
            }
        });

        // Initialize application
        fetchMessages();
        subscribeToMessages();
    </script>
</body>
</html>
